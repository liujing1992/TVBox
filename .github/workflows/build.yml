name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择编译类型 (debug 或 release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 蜂蜜大佬的项目通常在根目录有专门的打包/构建脚本或使用 assembleRelease
      - name: Build APK
        run: ./gradlew make || ./gradlew assemble${{ github.event.inputs.build_type == 'release' && 'Release' || 'Debug' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ok-tv-apk
          path: |
            app/build/outputs/apk/**/*.apk
