name: Manual Build APK

# 核心：改成手动触发 (workflow_dispatch)
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择编译类型 (debug 或 release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ok-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk